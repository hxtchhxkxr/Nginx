events {}

http {
    server {
        listen 127.0.0.1:8081 default_server;
        server_name cake.test;

        location = /menu {
            root web;
            try_files $uri /index.html =404;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
        }

        location / {
            root web;
            index index.html;
        }
    }

    server {
        listen 127.0.0.1:8081;
        server_name admin.test;

        location / {
            default_type text/plain;
            return 200 "admin site\n";
        }
    }
}
